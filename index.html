    for (let x = 0; x < 2048; x += 6) { g.fillStyle = 'rgba(255,255,255,' + (0.012 + 0.012 * Math.sin(x * .05)) + ')'; g.fillRect(x, 0, 3, 384); }
    g.textBaseline = 'alphabetic'; g.textAlign = 'right';
    g.fillStyle = 'rgba(240,243,246,.75)'; g.font = '800 46px ' + DISPLAY;
    if ('letterSpacing' in g) g.letterSpacing = '22px';
    g.fillText('LUTAJUĆI', 1530, 132);
    if ('letterSpacing' in g) g.letterSpacing = '2px';
    g.fillStyle = '#f4f6f8'; g.font = '900 150px ' + DISPLAY; g.fillText('KAMIONDŽIJA', 1530, 268);
    g.fillStyle = '#e3122d'; g.fillRect(640, 286, 890, 12);
    const L = logo();
    if (L.complete && L.naturalWidth) g.drawImage(L, 1560, 60, 220, 220);
    return c;
  }
  function texPlate(name) {
    const c = canvas(512, 112), g = c.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, 512, 112);
    g.strokeStyle = '#ff3348'; g.lineWidth = 6; g.strokeRect(6, 6, 500, 100);
    g.fillStyle = '#ff5466'; g.textAlign = 'center'; g.font = '800 64px ' + DISPLAY;
    if ('letterSpacing' in g) g.letterSpacing = '6px';
    g.fillText(name, 256, 80, 470);
    return c;
  }
  function texDecal(name) {
    const c = canvas(1024, 128), g = c.getContext('2d');
    g.textAlign = 'center'; g.font = '900 92px ' + DISPLAY;
    if ('letterSpacing' in g) g.letterSpacing = '10px';
    g.lineWidth = 8; g.strokeStyle = '#c8142c'; g.lineJoin = 'round';
    g.strokeText(name, 512, 100, 980); g.fillStyle = '#f6f7f9'; g.fillText(name, 512, 100, 980);
    return c;
  }
  function texEmblem() { const c = canvas(128, 128), g = c.getContext('2d'); const L = logo(); if (L.complete && L.naturalWidth) g.drawImage(L, 0, 0, 128, 128); return c; }
  function texLic() { const c = canvas(256, 56), g = c.getContext('2d'); g.fillStyle = '#eef1f4'; g.fillRect(0, 0, 256, 56); g.fillStyle = '#1d4fa8'; g.fillRect(0, 0, 26, 56); g.strokeStyle = '#111'; g.lineWidth = 3; g.strokeRect(1.5, 1.5, 253, 53); g.fillStyle = '#111'; g.font = '700 34px Arial,sans-serif'; g.textAlign = 'center'; g.fillText('LK 2026', 140, 40); return c; }
  function texTape() { const c = canvas(512, 8), g = c.getContext('2d'); for (let x = 0; x < 512; x += 32) { g.fillStyle = '#d4182c'; g.fillRect(x, 0, 16, 8); g.fillStyle = '#eef0f2'; g.fillRect(x + 16, 0, 16, 8); } return c; }

  /* pomoćni oblici */
  const box = (w, h, d, r, x, y, z, rot) => new Geo().merge(rbox(w, h, d, r, r > .06 ? 4 : 2, .4), rot ? M4.mul(M4.T(x, y, z), rot) : M4.T(x, y, z));
  function tireGeo(width) {
    const s = width / .32;
    return lathe([[.3, -.155 * s], [.4, -.168 * s], [.48, -.16 * s], [.515, -.14 * s], [.53, -.108 * s], [.53, .108 * s], [.515, .14 * s], [.48, .16 * s], [.4, .168 * s], [.3, .155 * s]], 40);
  }
  function rimGeo(width, dish) {
    const s = width / .32;
    return lathe([[0, dish], [.1, dish], [.13, dish - .015], [.2, dish - .025], [.26, dish - .005], [.295, .12 * s], [.305, .15 * s], [.305, -.15 * s], [.29, -.15 * s]], 36);
  }
  function nutsGeo(y, r, cap) {
    const g = new Geo();
    for (let k = 0; k < 10; k++) {
      const a = k / 10 * PI * 2, x = Math.cos(a) * .165, z = Math.sin(a) * .165;
      const part = cap ? lathe([[.026, 0], [.026, .02], [.018, .05], [.003, .085]], 10) : cyl(.017, .035, 6);
      g.merge(part, M4.T(x, y + (cap ? 0 : .015), z));
    }
    if (cap) g.merge(lathe([[.075, 0], [.07, .03], [.05, .06], [0, .075]], 20), M4.T(0, y, 0));
    return g;
  }

  /* izgradnja scene u rendereru */
  function build(R3, opt = {}) {
    const color = opt.color || '#c8142c';
    const M = mats(color);
    const trailer = opt.trailer !== false;
    const parts = {};
    const put = (geo, mat, group = 'base') => { const k = mat + '|' + group; if (!parts[k]) parts[k] = {geo: new Geo(), mat, group}; parts[k].geo.merge(geo); };
    const sprites = [], pools = [];
    const glow = (p, s, c, a, group = 'base', k) => sprites.push({p, s, c, a, group, k});
    const side = f => { f(1); f(-1); };

    // teksture
    const name = (opt.name || 'TVOJE IME').toUpperCase();
    R3.texture('curtain', texCurtain()); R3.texture('plate', texPlate(name)); R3.texture('decal', texDecal(name));
    R3.texture('emblem', texEmblem()); R3.texture('lic', texLic()); R3.texture('tape', texTape());

    /* ---- kabina ---- */
    const cab = rbox(CF - CB0, CY1 - CY0, 2 * W, .2, 5, .22);
    cab.deform(p => {
      let [x, y, z] = p; x += (CF + CB0) / 2; y += (CY0 + CY1) / 2;
      const wf = Math.max(0, Math.min(1, (x - (CF - .95)) / .95));
      const zf = Math.max(-1.2, Math.min(1.2, z / W));
      x -= (rake(y) + CURV * zf * zf) * wf;
      z *= 1 - .035 * Math.max(0, (y - 2.2) / (CY1 - 2.2));
      if (y > CY1 - .35) y += .05 * (1 - zf * zf) * ((y - (CY1 - .35)) / .35);
      return [x, y, z];
    }).normals(true);
    put(cab, 'paint');
    // gornja linija krova (tamna traka gde je krov)
    // vetrobran: zaobljeni pravougaonik na zakrivljenom prednjem delu
    const ws = (zr, y0, y1, off, cr) => surf((u, v) => {
      let z = (u - .5) * 2 * zr, y = y0 + (y1 - y0) * v;
      const dz = Math.abs(z) - (zr - cr), dy = Math.max(y0 + cr - y, y - (y1 - cr), 0);
      if (dz > 0 && dy > 0) { const l = Math.hypot(dz, dy); if (l > cr) { z = Math.sign(z) * (zr - cr + dz * cr / l); y = y < (y0 + y1) / 2 ? y0 + cr - dy * cr / l : y1 - cr + dy * cr / l; } }
      return [frontX(y, z) + off, y, z];
    }, 36, 12);
    put(ws(1.06, 2.16, 3.34, .006, .14), 'trim');
    put(ws(1.0, 2.2, 3.3, .016, .11), 'glass');
    // natpis na vetrobranu i tabla sa imenom
    put(surf((u, v) => { const z = (u - .5) * 1.7, y = 3.12 + .15 * v; return [frontX(y, z) + .024, y, -z]; }, 20, 2), 'decal', 'decal');
    put(surf((u, v) => { const z = (u - .5) * .82, y = 2.24 + .17 * v; return [frontX(y, z) + .011, y, -z]; }, 8, 2), 'plate', 'plate');
    glow([frontX(2.3, 0) + .05, 2.32, 0], .32, [1, .15, .2], .55, 'plate');
    // maska
    put(surf((u, v) => { const z = (u - .5) * 1.72, y = 1.43 + .66 * v; return [frontX(y, z) + .012, y, z]; }, 24, 4), 'trim');
    for (let k = 0; k < 6; k++) { const y = 1.5 + k * .1; put(surf((u, v) => { const z = (u - .5) * 1.6, yy = y + .028 * v; return [frontX(yy, z) + .03, yy, z]; }, 20, 1), k % 2 ? 'chrome' : 'alu'); }
    put(surf((u, v) => { const z = (u - .5) * .3, y = 1.88 + .3 * v; return [frontX(y, z) + .045, y, -z]; }, 4, 2), 'emblem');
    // donji prednji deo i branik
    put(box(.44, .82, 2.46, .12, CF - .06, .84, 0), 'paint');
    put(box(.34, .2, 2.3, .06, CF - .02, .5, 0), 'plastic');
    put(box(.06, .5, 1.5, .03, CF + .15, .82, 0), 'trim');
    put(surf((u, v) => [CF + .186, .72 + .14 * v, (.5 - u) * .52], 2, 1), 'lic');
    // farovi
    side(s => {
      put(box(.08, .2, .44, .05, CF + .14, 1.1, s * .92), 'trim');
      put(box(.04, .12, .16, .03, CF + .17, 1.1, s * .82), 'headlamp');
      put(box(.04, .12, .16, .03, CF + .17, 1.1, s * 1.02), 'headlamp');
      put(box(.03, .025, .4, .01, CF + .175, 1.2, s * .92), 'drl');
      glow([CF + .3, 1.1, s * .82], .3, [1, 1, 1], .75); glow([CF + .3, 1.1, s * 1.02], .3, [1, 1, 1], .75);
      glow([CF + .3, 1.2, s * .92], .4, [.9, .95, 1], .6);
      put(box(.04, .08, .12, .03, CF + .16, .6, s * .95), 'headlamp');
      glow([CF + .28, .6, s * .95], .3, [1, .97, .9], .6);
    });
    // retrovizori
    side(s => {
      const mx = frontX(3.0, W) - .12;
      put(box(.07, .07, .32, .03, mx, 3.2, s * (W + .14)), 'black');
      put(box(.16, .62, .26, .06, mx + .02, 2.86, s * (W + .32)), 'black');
      put(box(.012, .5, .2, .02, mx + .1, 2.88, s * (W + .32)), 'glass');
      put(box(.14, .24, .2, .05, mx + .02, 2.38, s * (W + .3)), 'black');
      put(box(.05, .45, .05, .02, mx, 2.62, s * (W + .3)), 'black');
    });
    // bočni prozori
    side(s => {
      put(surf((u, v) => { const y = 2.26 + .9 * v, x0 = 1.28, x1 = frontX(y, W) - .2; const x = x0 + (x1 - x0) * u; return [x, y, s * (halfW(y) + .006)]; }, 8, 6), 'trim');
      put(surf((u, v) => { const y = 2.3 + .82 * v, x0 = 1.32, x1 = frontX(y, W) - .25; const x = x0 + (x1 - x0) * u; return [x, y, s * (halfW(y) + .012)]; }, 8, 6), 'glass');
      put(box(.012, 1.9, .012, 0, 1.2, 2.26, s * (W + .004)), 'trim');
      put(box(.18, .04, .03, .012, 1.0, 2.05, s * (W + .01)), 'trim');
      // bočni produžeci kabine
      put(box(.5, 2.46, .05, .02, CB0 - .2, 2.6, s * (W - .03)), 'paint');
      // ugaoni panel ispred točka i stepenici
      put(box(.4, .7, .1, .04, 1.82, .88, s * (W - .05)), 'plastic');
      put(box(.42, .78, .1, .04, .27, .82, s * (W - .06)), 'plastic');
      put(box(.36, .04, .26, .015, .27, .66, s * (W - .1)), 'grey');
      put(box(.36, .04, .26, .015, .27, 1.02, s * (W - .1)), 'grey');
      put(box(.38, .02, .28, .01, .27, .69, s * (W - .1)), 'chrome', 'steps');
      put(box(.38, .02, .28, .01, .27, 1.05, s * (W - .1)), 'chrome', 'steps');
    });
    // blatobrani prednjih točkova (luk iznad točka)
    side(s => {
      const arc = lathe([[.63, -.19], [.66, -.21], [.66, .21], [.63, .19]], 18, 0, PI);
      put(new Geo().merge(arc, M4.chain(M4.T(FA, R, s * (W - .2)), M4.RX(PI / 2), M4.RY(PI))), 'plastic');
    });
    // donja crna obloga kabine i ugaoni deflektori
    side(s => {
      put(surf((u, v) => { const y = 1.24 + .3 * v, x = CB0 + .05 + (frontX(y, W) - .32 - CB0) * u; return [x, y, s * (W + .004)]; }, 10, 2), 'plastic');
      put(box(.1, .82, .07, .03, frontX(1.8, W) - .14, 1.74, s * (W - .02)), 'trim');
    });
    put(surf((u, v) => { const z = (u - .5) * 2.1, y = 1.24 + .17 * v; return [frontX(y, z) + .008, y, z]; }, 20, 1), 'plastic');
    // šasija i bočne obloge
    side(s => put(box(5.9, .28, .1, .02, -.9, .92, s * .45), 'black'));
    side(s => {
      put(box(2.3, .78, .05, .03, -1.06, .8, s * (W - .05)), 'paint');
      put(box(2.3, .06, .07, .02, -1.06, .42, s * (W - .05)), 'plastic');
      [-1.9, -1.4, -.9, -.4].forEach(x => { put(box(.08, .03, .02, .008, x, .48, s * (W - .02)), 'amber', 'side'); glow([x, .48, s * (W + .04)], .32, [1, .55, .1], 1, 'side'); });
      put(box(.08, .03, .02, .008, 1.82, .62, s * W), 'amber', 'side'); glow([1.82, .62, s * (W + .05)], .32, [1, .55, .1], 1, 'side');
    });
    // krovni obeleživači
    side(s => { put(box(.06, .04, .12, .015, frontX(CY1, 1.05) - .08, CY1 + .02, s * 1.0), 'amber', 'side'); glow([frontX(CY1, 1.05) + .02, CY1 + .03, s * 1.0], .38, [1, .55, .1], 1, 'side'); });
    // sedlo i zadnji blatobrani
    put(box(1.1, .12, 1.0, .03, RA + .15, 1.16, 0), 'grey');
    side(s => {
      put(box(1.25, .04, .66, .02, RA, 1.18, s * .96), 'black');
      put(box(.04, .62, .62, .02, RA - .72, .62, s * .96), 'rubber');
      put(box(.08, .05, .2, .02, -3.72, .92, s * .95), 'red');
    });

    /* ---- oprema na krovu i spreda ---- */
    const barX = frontX(CY1, 0) - .3;
    put(box(.14, .16, 1.72, .06, barX, CY1 + .19, 0), 'black', 'ledbar');
    side(s => put(box(.1, .14, .05, .02, barX - .02, CY1 + .08, s * .6), 'black', 'ledbar'));
    for (let k = 0; k < 12; k++) { const z = -.75 + k * (1.5 / 11); put(box(.02, .085, .1, .015, barX + .07, CY1 + .19, z), 'ledcell', 'ledbar'); glow([barX + .2, CY1 + .19, z], .26, [1, .97, .9], .6, 'ledbar'); }
    // štitnik za sunce
    put(surf((u, v) => { const z = (u - .5) * 2.36, yT = 3.5, yB = 3.36, y = yT + (yB - yT) * v; const xb = frontX(yT, z); return [xb + .01 + .34 * v, y - .02 * Math.sin(v * PI), z]; }, 30, 4), 'chrome', 'visor');
    put(surf((u, v) => { const z = (u - .5) * 2.36, y = 3.36 - .025 * v; const xb = frontX(3.5, z); return [xb + .35, y, z]; }, 30, 1), 'chrome', 'visor');
    for (let k = 0; k < 6; k++) { const z = -.95 + k * .38, x = frontX(3.5, z) + .33; put(box(.05, .02, .07, .01, x, 3.33, z), 'amber', 'visorled'); glow([x + .06, 3.31, z], .34, [1, .62, .15], 1, 'visorled'); }
    // okrugla dugačka svetla na braniku
    side(s => {
      const z = s * .55, x = CF + .2, y = 1.32;
      const hous = lathe([[0, -.12], [.12, -.12], [.15, -.06], [.15, .05], [.135, .06]], 24);
      put(new Geo().merge(hous, M4.chain(M4.T(x, y, z), M4.RZ(-PI / 2))), 'chrome', 'spots');
      put(new Geo().merge(lathe([[0, .062], [.13, .06]], 24), M4.chain(M4.T(x, y, z), M4.RZ(-PI / 2))), 'lens', 'spots');
      put(box(.12, .1, .06, .02, x - .14, y - .1, z), 'black', 'spots');
      glow([x + .2, y, z], .55, [1, .97, .9], .85, 'spots');
    });
    // vazdušne trube
    side(s => {
      const z = s * .42, y = CY1 + .14;
      put(new Geo().merge(lathe([[.03, 0], [.034, .3], [.05, .5], [.09, .62], [.12, .66], [.115, .67]], 20), M4.chain(M4.T(.7, y, z), M4.RZ(-PI / 2))), 'chrome', 'horns');
      put(box(.6, .03, .05, .01, 1.0, y - .08, z), 'black', 'horns');
    });

    /* ---- prikolica ---- */
    const putT = put;
    if (trailer) {
      const put = (geo, mat, group) => putT(geo, mat, group ? group + ':trailer' : 'trailer');
      const glow = (p, s, c, a, group) => sprites.push({p, s, c, a, group: group ? group + ':trailer' : 'trailer'});
      put(box(TL, .2, 2 * TW, .03, TF - TL / 2, TY0 + .06, 0), 'grey');
      put(box(TL, .16, 2 * TW + .01, .04, TF - TL / 2, TY1 - .08, 0), 'alu');
      put(box(TL - .04, .03, 2 * TW - .04, .01, TF - TL / 2, TY1 + .005, 0), 'white');
      put(box(.08, TY1 - TY0, 2 * TW, .03, TF - .04, (TY0 + TY1) / 2, 0), 'grey');
      // cerade
      side(s => put(surf((u, v) => { const x = s > 0 ? TR + .08 + (TL - .16) * u : TF - .08 - (TL - .16) * u; const y = TY0 + .17 + (TY1 - TY0 - .33) * v; return [x, y, s * (TW - .01 + .012 * Math.sin(u * PI * 50) * Math.sin(v * PI))]; }, 120, 6), 'curtain'));
      // stubovi i traka
      side(s => {
        [TF - .06, TR + .06].forEach(x => put(box(.1, TY1 - TY0, .1, .02, x, (TY0 + TY1) / 2, s * (TW - .03)), 'alu'));
        put(surf((u, v) => [s > 0 ? TR + (TL) * u : TF - TL * u, TY0 - .01 + .07 * v, s * (TW + .008)], 4, 1), 'tape');
        put(box(TL - .6, .12, .06, .02, TF - TL / 2, 1.08, s * (TW - .06)), 'black');
      });
      // zadnja vrata i svetla
      put(box(.06, TY1 - TY0 - .1, 2 * TW - .04, .02, TR, (TY0 + TY1) / 2, 0), 'grey');
      [-.85, -.3, .3, .85].forEach(z => put(new Geo().merge(cyl(.022, TY1 - TY0 - .3, 8), M4.T(TR - .05, (TY0 + TY1) / 2, z)), 'chrome'));
      side(s => {
        put(box(.05, .14, .42, .03, TR - .02, 1.08, s * 1.0), 'red');
        glow([TR - .18, 1.08, s * 1.0], .8, [1, .1, .12], .9);
        put(box(.05, .06, .06, .02, TR - .02, TY1 - .1, s * 1.15), 'red'); glow([TR - .12, TY1 - .1, s * 1.15], .4, [1, .1, .12], .8);
        put(box(.06, .06, .06, .02, TF + .02, TY1 - .1, s * 1.15), 'white');
      });
      put(box(.12, .14, 2.3, .03, TR + .25, .62, 0), 'alu');
      // šasija prikolice
      side(s => put(box(TL - 1.2, .3, .12, .02, TF - TL / 2 - .2, 1.04, s * .5), 'black'));
      // noge
      side(s => { put(box(.12, .74, .12, .02, TF - 2.5, .74, s * .9), 'grey'); put(box(.3, .04, .25, .01, TF - 2.5, .36, s * .9), 'black'); });
      // bočna zaštita
      side(s => { [.62, .9].forEach(y => put(box(5.8, .07, .04, .015, -6.9, y, s * (TW - .05)), 'alu')); [-4.2, -6.9, -9.6].forEach(x => put(box(.06, .4, .04, .01, x, .8, s * (TW - .07)), 'alu')); });
      // blatobran osovina
      put(box(4.1, .04, 2.3, .02, -12.26, 1.17, 0), 'black');
      side(s => put(box(.03, .55, .55, .02, -14.3, .6, s * 1.05), 'rubber'));
      // obeleživači na prikolici
      side(s => { for (let x = TF - 1.2; x > TR + .6; x -= 2.25) { put(box(.07, .04, .02, .008, x, TY0 - .08, s * (TW + .01)), 'amber'); glow([x, TY0 - .08, s * (TW + .07)], .34, [1, .55, .1], .85); } });
    }

    for (const k in parts) { const P = parts[k]; R3.add(P.geo, M[P.mat], P.group); }

    /* ---- točkovi ---- */
    const wheels = [];
    const tire = tireGeo(.32), tireW = tireGeo(.38), rim = rimGeo(.32, .13), rimW = rimGeo(.38, .15);
    const hub = new Geo().merge(lathe([[.1, .12], [.09, .16], [.05, .19], [0, .2]], 20));
    const nuts = nutsGeo(.13, .165, false), caps = nutsGeo(.13, .165, true);
    const wheelSet = [];
    const addWheel = (x, z, dual, wide) => {
      const s = z > 0 ? 1 : -1;
      const gname = 'wh' + wheelSet.length + (wide ? ':trailer' : '');
      const rec = {x, z, s, ang: 0, group: gname, dual: !!dual};
      const model = off => () => M4.chain(M4.T(rec.x, R, rec.z), M4.RZ(-rec.ang), M4.RX(s * PI / 2), M4.T(0, off, 0));
      const tw = wide ? tireW : tire, rm = wide ? rimW : rim;
      if (dual) { R3.add(tire, M.rubber, gname, model(-.33)); R3.add(rim, M.rim, gname, model(-.33)); }
      R3.add(tw, M.rubber, gname, model(0)); R3.add(rm, M.rim, gname, model(0));
      R3.add(hub, M.steel, gname, model(0)); R3.add(nuts, M.steel, gname + ':nocaps', model(0)); R3.add(caps, M.chrome, gname + ':caps', model(0));
      wheelSet.push(rec);
    };
    side(s => { addWheel(FA, s * (W - .2), false); addWheel(RA, s * (W - .14), true); });
    if (trailer) side(s => [-10.95, -12.26, -13.57].forEach(x => addWheel(x, s * (TW - .2), false, true)));

/* ---------- Zvuk puta: tiho brujanje motora i mekani akordi (pravi se u pregledaču, bez fajlova) ---------- */
const Sound = (() => {
  let ac = null, master = null, pad = null, verb = null, on = false, timer = null, step = 0;
  const CHORDS = [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]];
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

    const b = ac.createBuffer(1, ac.sampleRate * sec, ac.sampleRate), d = b.getChannelData(0);
    let last = 0;
    for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; if (brown) { last = (last + .02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w; }

  }

    return b;
  }

    verb = ac.createConvolver(); verb.buffer = impulse(3.4);
    const wet = ac.createGain(); wet.gain.value = .5; verb.connect(wet); wet.connect(master);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1300;
    pad = ac.createGain(); pad.gain.value = .55; pad.connect(lp); lp.connect(master); lp.connect(verb);
    // brujanje puta
    const rum = ac.createBufferSource(); rum.buffer = noise(4, true); rum.loop = true;
    const rf = ac.createBiquadFilter(); rf.type = 'lowpass'; rf.frequency.value = 170;
    const rg = ac.createGain(); rg.gain.value = .5;
    rum.connect(rf); rf.connect(rg); rg.connect(master); rum.start();
    const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = .11; lg.gain.value = .12; lfo.connect(lg); lg.connect(rg.gain); lfo.start();
  }

    const t = ac.currentTime + .05, notes = CHORDS[step++ % CHORDS.length];

      ['triangle', 'sine'].forEach((type, j) => {

    master.gain.linearRampToValueAtTime(on ? .5 : 0, t + (on ? 2.5 : .8));

})();

}

function addToCart(id, qty, txt, srcEl, quiet) {
  if (Konfig.outOfStock(id)) { toast('Trenutno nema na stanju: ' + PROD[id].name, false); return; }
  qty = Math.max(1, Math.min(99, Math.floor(qty) || 1));
  txt = (txt || '').trim().toUpperCase().slice(0, 20);
  const it = cart.find(i => keyOf(i.id, i.txt) === keyOf(id, txt));
  if (it) it.qty = Math.min(99, it.qty + qty); else cart.push({id, qty, txt});
  saveCart();
  fly(srcEl, () => { updateCart(); const c = $('#cartCount'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); });
  if (!quiet) toast('Dodato u korpu: ' + PROD[id].name + (qty > 1 ? ' (' + qty + ' kom)' : ''));
}
function setQty(key, q) {
  const it = cart.find(i => keyOf(i.id, i.txt) === key); if (!it) return;
  q = Math.floor(q);

function fly(src, done) {
  const target = $('#cartBtn');

  const a = src.getBoundingClientRect(), b = target.getBoundingClientRect();
  const x0 = a.left + a.width / 2, y0 = a.top + a.height / 2, x1 = b.left + b.width / 2, y1 = b.top + b.height / 2;
  const dot = document.createElement('div'); dot.className = 'flydot'; document.body.appendChild(dot);
  const mx = (x0 + x1) / 2, my = Math.min(y0, y1) - 120;
  const an = dot.animate([
    {transform: 'translate(' + x0 + 'px,' + y0 + 'px) scale(1)'},
    {transform: 'translate(' + mx + 'px,' + my + 'px) scale(1.2)', offset: .5},
    {transform: 'translate(' + x1 + 'px,' + y1 + 'px) scale(.4)'}

/* ---------- Ruter ---------- */
function route() { let h = location.hash.slice(1); try { h = decodeURIComponent(h); } catch (e) {} return h || 'pocetna'; }
const isHome = r => r === 'pocetna' || r === 'oprema' || HOME_SECTIONS.includes(r);
let lastRoute = null;
function setMain(html, fade) {
  const m = $('#main');
  m.innerHTML = html;
  if (fade && !reduced && m.animate) m.animate([{opacity: 0, transform: 'translateY(14px)'}, {opacity: 1, transform: 'none'}], {duration: 700, easing: 'cubic-bezier(.16,1,.3,1)'});

let renderTok = 0;
function render() {
  const r = route(), prev = lastRoute, first = prev === null, tok = ++renderTok;
  lastRoute = r;
  Konfig.leave();
  if (openLayer) closeL(false);
  ddToggle(false);
  $('#toast').classList.remove('show');
  if (r !== filt.route) filt = {route: r, chip: 'sve', sort: 'pre'};
  const sameMode = !first && ((CAT[r] && CAT[prev]) || (BRAND[r] && BRAND[prev]));
  let title = 'Lutajući Kamiondžija';
  if (isHome(r)) {
    if (first || !isHome(prev)) { setMain(viewHome(), !first); Garage.mount(); Garage.sync(); revealGrid($('#main'), first ? 600 : 200); BrandArt.watch(); }
    let stop = r === 'pocetna' ? 0 : r === 'oprema' ? 1 : (Stage.cur <= 5 ? Stage.cur : 0);
    if (HOME_SECTIONS.includes(r)) {
      const modeChange = Stage.mode !== 'home';
      if (modeChange) { $('#stage').style.transition = 'none'; }
      Stage.setMode('home', stop, {instant: first || modeChange});
      requestAnimationFrame(() => {
        $('#stage').style.transition = '';
        const sec = document.getElementById(r);
        if (sec) sec.scrollIntoView({behavior: (first || reduced) ? 'auto' : 'smooth', block: 'start'});
      });
    } else {
      Stage.setMode('home', stop, {instant: first});
      if (!first) scrollTo({top: 0, behavior: reduced ? 'auto' : 'smooth'});
    }
    title = 'Lutajući Kamiondžija · Oprema za kamion i kabinu';
  } else if (CAT[r] || BRAND[r]) {
    const isCat = !!CAT[r];
    if (sameMode) {
      const g = $('.grid', $('#gridBox')); if (g) g.classList.add('leaving');
      setTimeout(() => { if (tok !== renderTok) return; setMain(isCat ? viewCat(CAT[r]) : viewBrand(BRAND[r]), false); refreshGrid(true, 700); }, 320);
      if (scrollY > 10) scrollTo({top: 0, behavior: reduced ? 'auto' : 'smooth'});
    } else {
      setMain(isCat ? viewCat(CAT[r]) : viewBrand(BRAND[r]), !first);
      refreshGrid(true, first ? 900 : 650);
      scrollTo({top: 0, behavior: 'instant'});
    }
    pendingFocus = !first;
    Stage.setMode(isCat ? 'cat' : 'brand', STOP_OF[r], {instant: first});
    title = (isCat ? CAT[r].name : 'Oprema za ' + BRAND[r].name) + ' · Lutajući Kamiondžija';
  } else if (r.startsWith('p-') && PROD[r.slice(2)]) {
    const p = PROD[r.slice(2)];
    Stage.setMode('band', STOP_OF[p.brand || p.cat], {instant: first});
    setMain(viewProduct(p), !first); bindProduct(p);
    scrollTo({top: 0, behavior: 'instant'});
    if (!first) { const h = $('#main h1'); if (h) h.focus({preventScroll: true}); }

  $('#brandLink').innerHTML = LOGO + words;
  $('#ddBtn').innerHTML = 'Oprema ' + UI.chev;
  $('#ddPanel').innerHTML = '<div class="dd-col"><h3>Stanice na putu</h3>' + CATS.map(c => '<a class="dd-cat" href="#' + c.id + '"><span class="art t-' + c.id + '">' + ic(c.icon) + '</span><span><b>' + esc(c.name) + '</b><span>' + esc(c.blurb) + '</span></span></a>').join('') + '</div>' +
    '<div class="dd-col"><h3>Po marki kamiona</h3>' + BRANDS.map(b => '<a class="dd-brand" href="#' + b.id + '"><span><i style="color:' + b.hi + ';background:' + b.color + '"></i>' + esc(b.name) + '</span><small>' + P.filter(p => p.brand === b.id).length + '</small></a>').join('') + '<a class="dd-brand" href="#garaza" style="margin-top:8px;border-top:1px solid var(--line);border-radius:0;padding-top:14px"><span>' + UI.wand + '&nbsp; Garaža: opremi kamion</span></a></div>';
  $('#searchBtn').innerHTML = UI.search + '<span class="lbl">Pretraga</span><kbd>Ctrl K</kbd>';
  $('#soundBtn').innerHTML = '<span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="lbl">Zvuk puta</span>';
  $('#cartBtn').innerHTML = UI.cart + '<span class="lbl">Korpa</span><span class="count" id="cartCount">0</span>';
  $('#menuBtn').innerHTML = UI.menu;
  $('#cartClose').innerHTML = UI.close;
  $('#palIcon').innerHTML = UI.search;
  $('#sPrev').innerHTML = '<span class="circ">' + UI.left + '</span><span class="nm"></span>';
  $('#sNext').innerHTML = '<span class="circ">' + UI.arrow + '</span><span class="nm"></span>';
  $('#mmenu').innerHTML = '<h3>Stanice na putu</h3>' + CATS.map((c, k) => '<a class="mm-cat" href="#' + c.id + '" style="--d:' + (k * 50) + '"><span class="art t-' + c.id + '">' + ic(c.icon) + '</span><b>' + esc(c.name) + '</b></a>').join('') +
    '<h3>Po marki kamiona</h3><div class="mm-brands">' + BRANDS.map(b => '<a href="#' + b.id + '">' + esc(b.name) + '</a>').join('') + '</div>' +
    '<h3>Kupovina</h3><div class="mm-links"><a href="#konfigurator">3D konfigurator kamiona i prikolice</a><a href="#garaza">Garaža: opremi kamion</a><a href="#kako-kupujem">Kako kupuješ</a><a href="#pitanja">Česta pitanja</a><a href="#kontakt">Kontakt</a></div>';
  $('#ftr').innerHTML = '<div class="wrap"><div class="f-grid">' +
    '<div><a href="#pocetna" class="brand" aria-label="Lutajući Kamiondžija, početna">' + LOGO + words + '</a><p class="f-about">Oprema za kamion i život u kabini, od vozača za vozače. Svrati kad god ti zatreba, svetla su upaljena 0–24.</p><div class="pay" aria-label="Načini plaćanja"><span>Visa</span><span>Mastercard</span><span>Maestro</span><span>DinaCard</span><span>Pouzećem</span></div></div>' +
    '<div><h3>Stanice</h3><ul>' + CATS.map(c => '<li><a href="#' + c.id + '">' + esc(c.name) + '</a></li>').join('') + '</ul></div>' +
    '<div><h3>Marke kamiona</h3><ul>' + BRANDS.map(b => '<li><a href="#' + b.id + '">' + esc(b.name) + '</a></li>').join('') + '</ul></div>' +
    '<div><h3>Kupovina</h3><ul><li><a href="#konfigurator">3D konfigurator</a></li><li><a href="#garaza">Garaža</a></li><li><a href="#admin">Admin</a></li><li><a href="#kako-kupujem">Kako kupuješ</a></li><li><a href="#pitanja">Česta pitanja</a></li><li><a href="#kontakt">Kontakt</a></li><li><button type="button" data-open-cart>Korpa</button></li></ul></div>' +
    '</div><p class="f-big" aria-hidden="true">Srećan put</p><div class="f-bottom"><span>© ' + new Date().getFullYear() + ' Lutajući Kamiondžija. Probna prodavnica: artikli i cene su primeri.</span><span>Nazivi marki kamiona služe samo da označe za koji kamion je oprema. Nismo ovlašćeni zastupnik proizvođača.</span></div></div>';
}

/* ---------- Događaji ---------- */
const App = {
  userTook() { if (Stage.mode === 'home') Stage.stopCruise(); const h = $('#hintDrag'); if (h) h.classList.add('gone'); },
  goStop(i) { const s = STOPS[i]; if (Stage.mode === 'home') Stage.go(i); else location.hash = s.id; },
  overlayOpen() { return !!openLayer || $('#ddBtn').getAttribute('aria-expanded') === 'true'; }
};
function stepStop(dir) {
  const m = Stage.mode, [a, b] = Stage.range;
  let t = Stage.cur + dir;
  if (m === 'home') { if (t < a || t > b) return false; App.userTook(); Stage.go(t); return true; }
  if (m === 'cat' || m === 'brand') { if (t < a) t = b; if (t > b) t = a; location.hash = STOPS[t].id; return true; }
  return false;
}
const typing = el => el && (el.closest('input,textarea,select,[contenteditable="true"]'));

document.addEventListener('click', e => {
  const t = e.target;
  if (Konfig.click(t, e)) return;
  if (Garage.click(t)) return;
  const add = t.closest('[data-add]');
  if (add) {
    const q = add.dataset.qtyFrom ? document.getElementById(add.dataset.qtyFrom) : null;
    const tx = add.dataset.txtFrom ? document.getElementById(add.dataset.txtFrom) : null;
    addToCart(add.dataset.add, q ? parseInt(q.value, 10) : 1, tx ? tx.value : '', add);
    return;
  }
  const go = t.closest('[data-go]');
  if (go) { App.userTook(); Stage.go(Number(go.dataset.go)); return; }
  const sc = t.closest('[data-scroll]');
  if (sc) { const el = document.getElementById(sc.dataset.scroll); if (el) el.scrollIntoView({behavior: reduced ? 'auto' : 'smooth', block: 'start'}); return; }
  if (t.closest('#sPrev')) { stepStop(-1); return; }
  if (t.closest('#sNext')) { stepStop(1); return; }
  if (t.closest('[data-open-cart]')) { $('#toast').classList.remove('show'); openL('cart'); return; }
  if (t.closest('#cartBtn')) { openL('cart'); return; }
  if (t.closest('#searchBtn')) { openL('palette'); return; }
  if (t.closest('#menuBtn')) { if (openLayer === 'mmenu') closeL(); else openL('mmenu'); return; }
  if (t.closest('#ddBtn')) { ddToggle(); return; }
  if (t.closest('#soundBtn')) {
    const b = $('#soundBtn');
    Sound.toggle().then(on => { b.setAttribute('aria-pressed', String(on)); b.setAttribute('aria-label', on ? 'Isključi zvuk puta' : 'Uključi zvuk puta'); });
    return;
  }
  if (t.closest('#cartClose') || t === scrim || (t.closest('#palette') && !t.closest('.pal'))) { closeL(); return; }
  const qb = t.closest('[data-q]'); if (qb) { const q = $('#palQ'); q.value = qb.dataset.q; palRender(); q.focus(); return; }
  const chip = t.closest('.toolbar [data-chip], .empty [data-chip]');
  if (chip) { filt.chip = chip.dataset.chip; refreshGrid(true, 30); return; }
  const step = t.closest('[data-step]');
  if (step) { const inp = $('#pdQty'); inp.value = Math.max(1, Math.min(99, (parseInt(inp.value, 10) || 1) + Number(step.dataset.step))); return; }
  const cq = t.closest('[data-cq]');
  if (cq) { const it = cart.find(i => keyOf(i.id, i.txt) === cq.dataset.cq); if (it) { setQty(cq.dataset.cq, it.qty + Number(cq.dataset.d)); const again = $('[data-cq="' + CSS.escape(cq.dataset.cq) + '"][data-d="' + cq.dataset.d + '"]'); if (again) again.focus(); else $('#cartClose').focus(); } return; }
  const rm = t.closest('[data-rm]'); if (rm) { setQty(rm.dataset.rm, 0); $('#cartClose').focus(); return; }
  const cp = t.closest('[data-copy]');
  if (cp) {
    const v = cp.dataset.copy;
    (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast('Kopirano: ' + v, false), () => toast('Kopiranje nije uspelo. Prepiši: ' + v, false));
    return;
  }
  if (!t.closest('.dd')) ddToggle(false);
  const a = t.closest('a[href^="#"]');
  if (a) {
    if (a.id === 'skipLink') { e.preventDefault(); $('#main').focus(); return; }
    const want = a.getAttribute('href').slice(1) || 'pocetna';
    if (a.hasAttribute('data-close') || a.closest('#mmenu') || a.closest('#palette')) closeL(false);
    if (want === route()) { e.preventDefault(); if (CAT[want] || BRAND[want]) scrollTo({top: 0, behavior: reduced ? 'auto' : 'smooth'}); else render(); }
    return;
  }
  if (t.closest('[data-close]')) { closeL(); return; }
});
document.addEventListener('input', e => {
  if (Konfig.input(e.target)) return;
  if (Garage.input(e.target)) return;
  if (e.target.id === 'palQ') palRender();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (Konfig.change(t)) return;
  if (t.id === 'sortSel') { filt.sort = t.value; refreshGrid(true, 30); }
  if (t.matches('[data-cqi]')) setQty(t.dataset.cqi, parseInt(t.value, 10));
  if (t.id === 'pdQty') t.value = Math.max(1, Math.min(99, parseInt(t.value, 10) || 1));
});
document.addEventListener('keydown', e => {
  if ((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); if (openLayer === 'palette') closeL(); else openL('palette'); return; }
  if (e.key === '/' && !typing(e.target) && !openLayer) { e.preventDefault(); openL('palette'); return; }
  if (e.key === 'Escape') {
    if (openLayer) { e.preventDefault(); closeL(); return; }
    if ($('#ddBtn').getAttribute('aria-expanded') === 'true') { ddToggle(false); $('#ddBtn').focus(); return; }
  }
  if (openLayer === 'palette' && e.target.id === 'palQ') {
    const opts = $$('.pal-opt', $('#palRes'));
    if (e.key === 'ArrowDown') { e.preventDefault(); palSel = Math.min(opts.length - 1, palSel + 1); palMark(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); palSel = Math.max(0, palSel - 1); palMark(); return; }
    if (e.key === 'Enter') { e.preventDefault(); const o = opts[palSel]; if (o) { closeL(false); location.hash = o.getAttribute('href').slice(1); } return; }
  }
  if (openLayer && e.key === 'Tab') {
    const box = $('#' + openLayer);
    const f = $$('a[href], button:not([disabled]), input, select, textarea', box).filter(el => el.offsetParent !== null);
    if (openLayer === 'mmenu') f.unshift($('#menuBtn'));
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    return;
  }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !openLayer && !typing(e.target) && !e.altKey && !e.metaKey && !e.ctrlKey && Stage.mode !== 'band' && scrollY < $('#stage').offsetHeight * .5) {
    if (stepStop(e.key === 'ArrowRight' ? 1 : -1)) e.preventDefault();
  }
});
// točkić na sceni prelazi sa stanice na stanicu (samo na početnoj, dok je scena na vrhu)
(() => {
  let lastT = 0, acc = 0, needGap = false, lockUntil = 0;
  $('#stage').addEventListener('wheel', e => {
    if (Stage.mode === 'band' || openLayer) return;
    const horiz = Math.abs(e.deltaX) > Math.abs(e.deltaY) * 1.2;
    if (!horiz && (Stage.mode !== 'home' || scrollY > 4)) return;
    const d = horiz ? e.deltaX : e.deltaY;
    const dir = d > 0 ? 1 : -1, [a, b] = Stage.range;
    if (!horiz && ((dir > 0 && Stage.cur >= b) || (dir < 0 && Stage.cur <= a))) return;
    if (horiz && Stage.mode === 'home' && ((dir > 0 && Stage.cur >= b) || (dir < 0 && Stage.cur <= a))) { e.preventDefault(); return; }
    e.preventDefault();
    const now = performance.now(), gap = now - lastT; lastT = now;
    if (needGap && gap < 240) return;
    needGap = false;
    if (now < lockUntil) return;
    if (gap > 240) acc = 0;
    acc += d;
    if (Math.abs(acc) > 36) { acc = 0; needGap = true; lockUntil = now + 900; stepStop(dir); }
  }, {passive: false});
})();
function onScroll() {
  $('#hdr').classList.toggle('solid', scrollY > 30 || Stage.mode === 'band');
}
addEventListener('scroll', onScroll, {passive: true});
addEventListener('hashchange', render);

/* ---------- Pokretanje ---------- */
buildChrome();
Stage.init({copy: copyHTML, holo: holoHTML, route: routeHTML, arrive: onArrive});
updateCart();
render();
if (!reduced) { const s = $('#stage'); s.classList.add('intro'); setTimeout(() => s.classList.remove('intro'), 3400); }

})();
</script>
